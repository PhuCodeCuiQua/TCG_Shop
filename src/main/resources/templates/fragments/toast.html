<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="toast" class="toast-container position-fixed top-0 end-0 p-3"
	 aria-live="polite" aria-atomic="true">
	<div class="toast text-bg-success border-0 mb-2" role="status" aria-live="polite"
		 th:if="${successMessage}">
		<div class="d-flex">
			<div class="toast-body" th:text="${successMessage}">Thao tác thành công.</div>
			<button type="button" class="btn-close btn-close-white me-2 m-auto"
					data-bs-dismiss="toast" aria-label="Đóng"></button>
		</div>
	</div>
	<div class="toast text-bg-danger border-0" role="alert" aria-live="assertive"
		 th:if="${errorMessage}">
		<div class="d-flex">
			<div class="toast-body" th:text="${errorMessage}">Đã xảy ra lỗi.</div>
			<button type="button" class="btn-close btn-close-white me-2 m-auto"
					data-bs-dismiss="toast" aria-label="Đóng"></button>
		</div>
	</div>
</div>
</body>
</html>
