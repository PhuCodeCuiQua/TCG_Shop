<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="sidebar(currentPath)" aria-label="Điều hướng Shipper">
	<p class="text-uppercase small text-white-50 mb-2">Shipper</p>
	<ul class="nav flex-column gap-1">
		<li class="nav-item"><a class="nav-link" th:href="@{/shipper/dashboard}"
								th:classappend="${currentPath == '/shipper/dashboard' ? ' active' : ''}">Dashboard</a></li>
		<li class="nav-item"><a class="nav-link" th:href="@{/shipper/orders}"
								th:classappend="${#strings.startsWith(currentPath, '/shipper/orders') and !#strings.contains(currentPath, 'tab=completed') ? ' active' : ''}">Đơn cần giao</a></li>
		<li class="nav-item"><a class="nav-link" th:href="@{/shipper/orders(tab='completed')}"
								th:classappend="${currentPath == '/shipper/orders?tab=completed' ? ' active' : ''}">Lịch sử giao</a></li>
		<li class="nav-item"><a class="nav-link" th:href="@{/shipper/statistics}"
								th:classappend="${currentPath == '/shipper/statistics' ? ' active' : ''}">Thu nhập</a></li>
	</ul>
</nav>
</body>
</html>
