<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="pagination(pageData, selectedTab, keyword)" th:if="${pageData.totalPages > 1}"
	 aria-label="Phân trang đơn hàng">
	<ul class="pagination justify-content-center">
		<li class="page-item" th:classappend="${pageData.first ? 'disabled' : ''}">
			<a class="page-link" th:if="${!pageData.first}"
			   th:href="@{/orders(tab=${selectedTab},q=${keyword},page=${pageData.page - 1})}" rel="prev">Trước</a>
			<span class="page-link" th:if="${pageData.first}">Trước</span>
		</li>
		<li class="page-item" th:each="pageNumber : ${#numbers.sequence(0, pageData.totalPages - 1)}"
			th:classappend="${pageNumber == pageData.page ? 'active' : ''}">
			<span class="page-link" th:if="${pageNumber == pageData.page}" th:text="${pageNumber + 1}" aria-current="page">1</span>
			<a class="page-link" th:if="${pageNumber != pageData.page}"
			   th:href="@{/orders(tab=${selectedTab},q=${keyword},page=${pageNumber})}" th:text="${pageNumber + 1}">2</a>
		</li>
		<li class="page-item" th:classappend="${pageData.last ? 'disabled' : ''}">
			<a class="page-link" th:if="${!pageData.last}"
			   th:href="@{/orders(tab=${selectedTab},q=${keyword},page=${pageData.page + 1})}" rel="next">Sau</a>
			<span class="page-link" th:if="${pageData.last}">Sau</span>
		</li>
	</ul>
</nav>
</body>
</html>
