<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="pagination(page)" th:if="${page.totalPages > 1}"
	 class="pagination-section"
	 th:with="windowStart=${page.totalPages <= 7 ? 0 : (page.getNumber() <= 3 ? 0 : (page.getNumber() >= page.totalPages - 4 ? page.totalPages - 6 : page.getNumber() - 2))},
			  windowEnd=${page.totalPages <= 7 ? page.totalPages - 1 : (page.getNumber() <= 3 ? 5 : (page.getNumber() >= page.totalPages - 4 ? page.totalPages - 1 : page.getNumber() + 2))}"
	 aria-label="Phân trang" data-pagination>
	<ul class="pagination justify-content-center flex-wrap gap-1 pagination-mobile-compact">
		<li class="page-item" th:classappend="${page.first ? 'disabled' : ''}">
			<a class="page-link" th:if="${!page.first}"
			   th:href="'?page=' + ${page.getNumber() - 1}"
			   th:attr="data-pagination-page=${page.getNumber() - 1}" rel="prev">Trước</a>
			<span class="page-link" th:if="${page.first}">Trước</span>
		</li>
		<li class="page-item d-none d-md-block" th:if="${windowStart > 0}"
			data-pagination-number="1">
			<a class="page-link" th:href="'?page=0'" data-pagination-page="0">1</a>
		</li>
		<li class="page-item d-none d-md-block" th:if="${windowStart > 1}"
			data-pagination-ellipsis="before">
			<span class="page-link" aria-hidden="true">…</span>
		</li>
		<li class="page-item"
			th:each="pageNumber : ${#numbers.sequence(windowStart, windowEnd)}"
			th:classappend="${pageNumber == page.getNumber() ? 'active' : 'd-none d-md-block'}"
			th:attr="data-pagination-number=${pageNumber + 1}">
			<span class="page-link" th:if="${pageNumber == page.getNumber()}"
				  th:text="${pageNumber + 1}" aria-current="page">1</span>
			<a class="page-link" th:if="${pageNumber != page.getNumber()}"
			   th:href="'?page=' + ${pageNumber}"
			   th:attr="data-pagination-page=${pageNumber}" th:text="${pageNumber + 1}">2</a>
		</li>
		<li class="page-item d-none d-md-block" th:if="${windowEnd < page.totalPages - 2}"
			data-pagination-ellipsis="after">
			<span class="page-link" aria-hidden="true">…</span>
		</li>
		<li class="page-item d-none d-md-block" th:if="${windowEnd < page.totalPages - 1}"
			th:attr="data-pagination-number=${page.totalPages}">
			<a class="page-link" th:href="'?page=' + ${page.totalPages - 1}"
			   th:attr="data-pagination-page=${page.totalPages - 1}"
			   th:text="${page.totalPages}">10</a>
		</li>
		<li class="page-item" th:classappend="${page.last ? 'disabled' : ''}">
			<a class="page-link" th:if="${!page.last}"
			   th:href="'?page=' + ${page.getNumber() + 1}"
			   th:attr="data-pagination-page=${page.getNumber() + 1}" rel="next">Sau</a>
			<span class="page-link" th:if="${page.last}">Sau</span>
		</li>
	</ul>
	<script>
		document.querySelectorAll("[data-pagination] a[data-pagination-page]").forEach((link) => {
			const url = new URL(window.location.href);
			url.searchParams.set("page", link.dataset.paginationPage);
			link.href = `${url.pathname}${url.search}${url.hash}`;
		});
	</script>
</nav>
</body>
</html>
