<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>500 - Lỗi hệ thống</title>
</head>
<body>
  <main>
    <h1 th:text="${status}">500</h1>
    <p th:text="${message}">Đã xảy ra lỗi hệ thống. Vui lòng thử lại sau.</p>
    <p th:if="${traceId != null}">Mã tra cứu: <span th:text="${traceId}"></span></p>
    <a th:href="@{/}">Về trang chủ</a>
  </main>
</body>
</html>
