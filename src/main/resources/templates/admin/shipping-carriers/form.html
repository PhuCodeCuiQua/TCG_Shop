<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/dashboard}">
<head>
	<title th:text="${formTitle}">Nhà vận chuyển</title>
</head>
<body>
<main class="container-fluid flex-grow-1 p-3 p-lg-4" layout:fragment="content">
	<div th:replace="~{fragments/breadcrumb :: breadcrumb(items=${breadcrumbItems})}"></div>

	<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
		<h1 class="h4 mb-0" th:text="${formTitle}">Nhà vận chuyển</h1>
		<a class="btn btn-outline-secondary" th:href="@{/admin/shipping-carriers}">Quay lại danh sách</a>
	</div>

	<form class="card card-body" method="post" enctype="multipart/form-data"
		  th:action="@{${formAction}}" th:object="${shippingCarrierRequest}" data-loading-form>
		<div class="alert alert-danger" role="alert" th:if="${#fields.hasGlobalErrors()}">
			<p class="mb-0" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
		</div>

		<div class="row g-3">
			<div class="col-12 col-md-6">
				<label class="form-label" for="name">Tên nhà vận chuyển</label>
				<input class="form-control" id="name" type="text" th:field="*{name}" maxlength="150" required>
				<div class="invalid-feedback d-block" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
			</div>
			<div class="col-12 col-md-6">
				<label class="form-label" for="code">Mã nhà vận chuyển</label>
				<input class="form-control text-uppercase" id="code" type="text" th:field="*{code}" maxlength="50" required>
				<div class="invalid-feedback d-block" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
			</div>
			<div class="col-12 col-md-6">
				<label class="form-label" for="baseFee">Phí cơ bản (VND)</label>
				<input class="form-control" id="baseFee" type="number" th:field="*{baseFee}"
					   min="0" step="0.01" required>
				<div class="invalid-feedback d-block" th:if="${#fields.hasErrors('baseFee')}" th:errors="*{baseFee}"></div>
			</div>
			<div class="col-12 col-md-6">
				<label class="form-label" for="freeShipThreshold">Ngưỡng miễn phí (VND)</label>
				<input class="form-control" id="freeShipThreshold" type="number" th:field="*{freeShipThreshold}"
					   min="0" step="0.01">
				<div class="form-text">Để trống nếu nhà vận chuyển không áp dụng miễn phí theo giá trị đơn.</div>
				<div class="invalid-feedback d-block"
					 th:if="${#fields.hasErrors('freeShipThreshold')}" th:errors="*{freeShipThreshold}"></div>
			</div>
			<div class="col-12">
				<label class="form-label" for="logo">Logo</label>
				<input class="form-control" id="logo" type="file" disabled aria-describedby="logoHelp">
				<div class="form-text" id="logoHelp">
					Chưa thể tải logo cho đến khi cơ sở dữ liệu lưu được mã ảnh Cloudinary để thay/xóa ảnh an toàn.
				</div>
				<img th:if="${carrier != null and carrier.logoUrl() != null}" th:src="${carrier.logoUrl()}"
					 th:alt="${carrier.name()}" class="mt-2 rounded border"
					 style="max-width: 10rem; max-height: 5rem; object-fit: contain">
			</div>
			<div class="col-12">
				<div class="form-check">
					<input class="form-check-input" id="active" type="checkbox" th:field="*{active}">
					<label class="form-check-label" for="active">Đang hoạt động</label>
				</div>
			</div>
			<div class="col-12 d-flex flex-wrap gap-2">
				<button class="btn btn-primary" type="submit">Lưu</button>
				<a class="btn btn-outline-secondary" th:href="@{/admin/shipping-carriers}">Hủy</a>
			</div>
		</div>
	</form>
</main>
<th:block layout:fragment="scripts">
	<script th:src="@{/js/admin-shipping-carriers.js}" defer></script>
</th:block>
</body>
</html>
