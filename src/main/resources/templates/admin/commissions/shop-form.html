<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/dashboard}">
<head>
	<title>Điều chỉnh hoa hồng chi nhánh</title>
</head>
<body>
<main class="container-fluid flex-grow-1 p-3 p-lg-4" layout:fragment="content">
	<div th:replace="~{fragments/breadcrumb :: breadcrumb(items=${breadcrumbItems})}"></div>
	<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
		<h1 class="h4 mb-0">Điều chỉnh hoa hồng chi nhánh</h1>
		<a class="btn btn-outline-secondary" th:href="@{/admin/commissions}">Quay lại</a>
	</div>

	<div class="card mb-3">
		<div class="card-body">
			<h2 class="h5" th:text="${shopRate.name()}">Tên chi nhánh</h2>
			<p class="mb-1">Tỷ lệ mặc định hệ thống:
				<strong th:text="${#numbers.formatDecimal(defaultRate, 1, 2)} + '%'">5.00%</strong>
			</p>
			<p class="mb-0">Tỷ lệ đang áp dụng:
				<strong th:text="${#numbers.formatDecimal(shopRate.effectiveRate(), 1, 2)} + '%'">5.00%</strong>
			</p>
		</div>
	</div>

	<form class="card card-body mb-3" method="post" th:action="@{${formAction}}"
		  th:object="${shopRateRequest}" data-loading-form>
		<div class="alert alert-danger" role="alert" th:if="${#fields.hasGlobalErrors()}">
			<p class="mb-0" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
		</div>
		<label class="form-label" for="rate">Tỷ lệ riêng (%)</label>
		<input class="form-control" id="rate" type="number" th:field="*{rate}"
			   min="0" max="100" step="0.01" required>
		<div class="form-text">Nhập từ 0 đến 100. Muốn dùng mức mặc định, hãy xóa tỷ lệ riêng bên dưới.</div>
		<div class="invalid-feedback d-block" th:if="${#fields.hasErrors('rate')}" th:errors="*{rate}"></div>
		<div class="mt-3">
			<button class="btn btn-primary" type="submit">Lưu tỷ lệ riêng</button>
		</div>
	</form>

	<form method="post" data-loading-form th:if="${shopRate.overrideRate() != null}"
		  th:action="@{/admin/commissions/shops/{shopId}/reset(shopId=${shopRate.id()})}">
		<button class="btn btn-outline-danger" type="submit">Xóa tỷ lệ riêng, dùng mức mặc định</button>
	</form>
</main>
<th:block layout:fragment="scripts">
	<script th:src="@{/js/admin-commissions.js}" defer></script>
</th:block>
</body>
</html>
