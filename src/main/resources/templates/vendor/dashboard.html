<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/dashboard}">
<head>
	<title>Dashboard Chi nhánh</title>
</head>
<body>
<main layout:fragment="content" class="container-fluid flex-grow-1 p-3 p-lg-4 vendor-dashboard-page">
	<div th:replace="~{fragments/breadcrumb :: breadcrumb(items=${breadcrumbItems})}"></div>
	<header class="mb-4">
		<p class="text-uppercase small fw-bold vendor-dashboard-eyebrow mb-2">QUẢN LÝ CHI NHÁNH</p>
		<h1 class="h3 mb-1">Dashboard Chi nhánh</h1>
		<p class="text-secondary mb-0">Tổng quan hoạt động của chi nhánh trong tháng này.</p>
	</header>
	<section class="row row-cols-1 row-cols-md-3 g-3" aria-label="Thống kê chi nhánh">
		<div class="col">
			<article class="card h-100 vendor-dashboard-stat-card"><div class="card-body">
				<h2 class="h6">Sản phẩm đang bán</h2>
				<p class="display-6 mb-0" th:text="${#numbers.formatInteger(statistics.activeProducts(), 0, 'COMMA')}">0</p>
			</div></article>
		</div>
		<div class="col">
			<article class="card h-100 vendor-dashboard-stat-card"><div class="card-body">
				<h2 class="h6">Đơn hàng mới</h2>
				<p class="display-6 mb-0" th:text="${#numbers.formatInteger(statistics.newOrders(), 0, 'COMMA')}">0</p>
			</div></article>
		</div>
		<div class="col">
			<article class="card h-100 vendor-dashboard-stat-card"><div class="card-body">
				<h2 class="h6">Doanh thu tháng</h2>
				<p class="display-6 mb-0" th:text="${#numbers.formatDecimal(statistics.monthlyRevenue(), 0, 'POINT', 0, 'COMMA') + ' ₫'}">0 ₫</p>
			</div></article>
		</div>
	</section>
</main>
</body>
</html>
