<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/dashboard}">
<head>
	<title>Dashboard Shipper</title>
	<th:block layout:fragment="head">
		<link rel="stylesheet" th:href="@{/css/shipper.css}">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	</th:block>
</head>
<body>
<main layout:fragment="content" class="container-fluid flex-grow-1 p-3 p-lg-4 shipper-dashboard-page">
	<div th:replace="~{fragments/breadcrumb :: breadcrumb(items=${breadcrumbItems})}"></div>
	<header class="shipper-dashboard-heading mb-4">
		<p class="shipper-eyebrow mb-2">MIDNIGHT RARE · VẬN CHUYỂN</p>
		<h1 class="h2 shipper-page-title mb-2">Dashboard của Shipper</h1>
		<p class="shipper-page-subtitle mb-0">Tổng quan công việc và COD trong tuần vừa qua.</p>
	</header>
	<section class="row row-cols-1 row-cols-sm-2 row-cols-xl-3 g-3 g-xl-4"
			 aria-label="Thống kê công việc Shipper">
		<div class="col">
			<article class="shipper-stat-card shipper-dashboard-stat-card h-100 p-4">
				<div class="d-flex align-items-start justify-content-between gap-3">
					<div><p class="shipper-stat-label mb-2">Đơn cần giao</p>
						<p class="shipper-stat-value shipper-stat-lilac mb-1"
						   th:text="${#numbers.formatInteger(statistics.ordersToDeliver(), 0, 'COMMA')}">0</p>
						<small class="shipper-stat-note">Đã xác nhận hoặc đang vận chuyển</small></div>
					<span class="shipper-stat-icon shipper-dashboard-icon-purple"><i class="bi bi-truck" aria-hidden="true"></i></span>
				</div>
			</article>
		</div>
		<div class="col">
			<article class="shipper-stat-card shipper-dashboard-stat-card h-100 p-4">
				<div class="d-flex align-items-start justify-content-between gap-3">
					<div><p class="shipper-stat-label mb-2">Đã giao hôm nay</p>
						<p class="shipper-stat-value shipper-stat-green mb-1"
						   th:text="${#numbers.formatInteger(statistics.deliveredToday(), 0, 'COMMA')}">0</p>
						<small class="shipper-stat-note">Đơn hoàn tất trong ngày</small></div>
					<span class="shipper-stat-icon shipper-dashboard-icon-green"><i class="bi bi-check2-circle" aria-hidden="true"></i></span>
				</div>
			</article>
		</div>
		<div class="col">
			<article class="shipper-stat-card shipper-dashboard-stat-card h-100 p-4">
				<div class="d-flex align-items-start justify-content-between gap-3">
					<div><p class="shipper-stat-label mb-2">Thu nhập COD tuần</p>
						<p class="shipper-stat-value shipper-stat-gold mb-1"
						   th:text="${#numbers.formatDecimal(statistics.weeklyCodIncome(), 0, 'POINT', 0, 'COMMA') + ' ₫'}">0 ₫</p>
						<small class="shipper-stat-note">COD đã thu trong 7 ngày gần nhất</small></div>
					<span class="shipper-stat-icon"><i class="bi bi-cash-coin" aria-hidden="true"></i></span>
				</div>
			</article>
		</div>
	</section>
	<div class="mt-4">
		<a class="btn shipper-dashboard-action" th:href="@{/shipper/orders}">
			<i class="bi bi-list-check me-2" aria-hidden="true"></i>Xem danh sách đơn được giao
		</a>
	</div>
</main>
</body>
</html>
