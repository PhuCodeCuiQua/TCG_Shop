<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="_csrf" th:content="${_csrf.token}">
	<meta name="_csrf_header" th:content="${_csrf.headerName}">
	<title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE" th:text="${globalSettings != null ? globalSettings.siteName : 'TCGSHOP'}">TCGSHOP</title>
	<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/css/custom.css}">
	<link rel="stylesheet" th:href="@{/css/vendor-shop.css}">
	<link rel="stylesheet" th:href="@{/css/notification-bell.css}">
	<link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
	<link rel="stylesheet" th:href="@{/css/chatbot.css}">
	<style>
		.dashboard-sidebar {
			width: 17rem;
			background: #212529;
		}

		.dashboard-sidebar .nav-link {
			color: rgba(255, 255, 255, .75);
			border-radius: .375rem;
		}

		.dashboard-sidebar .nav-link:hover,
		.dashboard-sidebar .nav-link.active {
			color: #fff;
			background: #0d6efd;
		}

		.dashboard-avatar {
			width: 2.25rem;
			height: 2.25rem;
			border-radius: 50%;
			background: #e9ecef;
			color: #495057;
		}
	</style>
	<th:block layout:fragment="head"></th:block>
</head>
<body class=""
	  th:classappend="${dashboardRole == 'MANAGER' and currentPath == '/manager/dashboard' ? ' manager-dashboard-layout' : (dashboardRole == 'SHIPPER' and currentPath == '/shipper/dashboard' ? ' shipper-dashboard-layout' : (dashboardRole == 'VENDOR' and currentPath == '/vendor/dashboard' ? ' vendor-dashboard-layout' : ''))}">
	<div class="d-flex min-vh-100">
		<aside class="dashboard-sidebar d-none d-lg-flex flex-column p-3 text-white">
			<a class="navbar-brand fw-bold text-white mb-4" th:href="@{/}"><span th:replace="~{fragments/site-brand :: brand}"></span></a>
			<th:block th:if="${dashboardRole == 'VENDOR'}">
				<div th:replace="~{fragments/sidebar/vendor :: sidebar(currentPath=${currentPath})}"></div>
			</th:block>
			<th:block th:if="${dashboardRole == 'SHIPPER'}">
				<div th:replace="~{fragments/sidebar/shipper :: sidebar(currentPath=${currentPath})}"></div>
			</th:block>
			<th:block th:if="${dashboardRole == 'MANAGER'}">
				<div th:replace="~{fragments/sidebar/manager :: sidebar(currentPath=${currentPath})}"></div>
			</th:block>
			<th:block th:if="${dashboardRole == 'ADMIN'}">
				<div th:replace="~{fragments/sidebar/admin :: sidebar(currentPath=${currentPath})}"></div>
			</th:block>
		</aside>

		<div class="offcanvas offcanvas-start dashboard-sidebar text-white" tabindex="-1"
			 id="dashboardSidebarMobile" aria-labelledby="dashboardSidebarMobileLabel">
			<div class="offcanvas-header">
				<a class="navbar-brand fw-bold text-white" id="dashboardSidebarMobileLabel" th:href="@{/}">
					<span th:replace="~{fragments/site-brand :: brand}"></span>
				</a>
				<button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
						aria-label="Đóng menu"></button>
			</div>
			<div class="offcanvas-body">
				<th:block th:if="${dashboardRole == 'VENDOR'}">
					<div th:replace="~{fragments/sidebar/vendor :: sidebar(currentPath=${currentPath})}"></div>
				</th:block>
				<th:block th:if="${dashboardRole == 'SHIPPER'}">
					<div th:replace="~{fragments/sidebar/shipper :: sidebar(currentPath=${currentPath})}"></div>
				</th:block>
				<th:block th:if="${dashboardRole == 'MANAGER'}">
					<div th:replace="~{fragments/sidebar/manager :: sidebar(currentPath=${currentPath})}"></div>
				</th:block>
				<th:block th:if="${dashboardRole == 'ADMIN'}">
					<div th:replace="~{fragments/sidebar/admin :: sidebar(currentPath=${currentPath})}"></div>
				</th:block>
			</div>
		</div>

		<div class="flex-grow-1 d-flex flex-column min-vh-100">
			<header class="navbar dashboard-topbar border-bottom px-3 px-lg-4">
				<div class="d-flex align-items-center gap-2">
					<button class="btn btn-outline-secondary d-lg-none" type="button"
							data-bs-toggle="offcanvas" data-bs-target="#dashboardSidebarMobile"
							aria-controls="dashboardSidebarMobile" aria-label="Mở menu điều hướng">
						<span aria-hidden="true">&#9776;</span>
					</button>
					<span class="fw-semibold d-none d-sm-inline" th:text="${dashboardTitle}">Dashboard</span>
				</div>
				<div class="d-flex align-items-center gap-2">
					<th:block sec:authorize="isAuthenticated()">
						<div th:replace="~{fragments/notification-bell :: bell}"></div>
					</th:block>
					<div class="dropdown">
						<button class="btn dashboard-account-toggle dropdown-toggle d-flex align-items-center gap-2" type="button"
								id="dashboardAccountMenu" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Mở menu tài khoản">
							<th:block sec:authorize="isAuthenticated()"
								th:with="user=${#authentication.principal instanceof T(com.tcgshop.security.CustomUserDetails) ? #authentication.principal : null},
									username=${#strings.contains(#authentication.name, '@') ? #strings.substringBefore(#authentication.name, '@') : #authentication.name},
									displayName=${user != null and !#strings.isEmpty(#strings.trim(user.fullName)) ? user.fullName : username}">
								<span class="dashboard-avatar d-inline-flex align-items-center justify-content-center" aria-hidden="true">
									<img th:if="${user != null and !#strings.isEmpty(#strings.trim(user.avatarUrl))}"
										 th:src="${user.avatarUrl}" alt="">
									<span th:unless="${user != null and !#strings.isEmpty(#strings.trim(user.avatarUrl))}"
										  th:text="${#strings.toUpperCase(#strings.substring(displayName, 0, 1))}">T</span>
								</span>
								<span class="dashboard-account-name" th:text="${displayName}" th:title="${displayName}">Tài khoản</span>
							</th:block>
							<span sec:authorize="isAnonymous()">Khách</span>
						</button>
						<ul class="dropdown-menu dropdown-menu-end dashboard-account-menu" aria-labelledby="dashboardAccountMenu">
							<li sec:authorize="isAuthenticated()"><a class="dropdown-item" th:href="@{/profile}">Hồ sơ cá nhân</a></li>
							<li sec:authorize="isAuthenticated()"><a class="dropdown-item" th:href="@{/profile/change-password}">Đổi mật khẩu</a></li>
							<li sec:authorize="hasRole('ADMIN')"><a class="dropdown-item" th:href="@{/admin/settings}">Cài đặt hệ thống</a></li>
							<li sec:authorize="isAuthenticated()"><hr class="dropdown-divider"></li>
							<li sec:authorize="isAuthenticated()">
								<form class="js-logout-form" method="post" th:action="@{/auth/logout}"
									  th:attr="data-csrf-parameter=${_csrf.parameterName}">
									<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
									<button class="dropdown-item" type="submit">Đăng xuất</button>
								</form>
							</li>
							<li sec:authorize="isAnonymous()">
								<a class="dropdown-item" th:href="@{/auth/login}">Đăng nhập</a>
							</li>
						</ul>
					</div>
				</div>
			</header>

			<main class="container-fluid flex-grow-1 p-3 p-lg-4" layout:fragment="content">
				<div th:replace="~{fragments/breadcrumb :: breadcrumb(items=${breadcrumbItems})}"></div>
			</main>

			<div th:replace="~{fragments/toast :: toast}"></div>
			<div th:replace="~{fragments/chatbot-widget :: widget}"></div>
		</div>
	</div>

	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
	<script th:src="@{/js/common.js}"></script>
	<script th:src="@{/js/chatbot.js}" defer></script>
	<th:block sec:authorize="isAuthenticated()">
		<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
		<script th:src="@{/js/notification-bell.js}" defer></script>
	</th:block>
	<script>
		document.addEventListener("DOMContentLoaded", () => {
			document.querySelectorAll(".toast").forEach((toastElement) => {
				bootstrap.Toast.getOrCreateInstance(toastElement, { delay: 3000 }).show();
			});
		});
	</script>
	<th:block layout:fragment="scripts"></th:block>
</body>
</html>
