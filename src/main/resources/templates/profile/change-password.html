<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/main}">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Đổi mật khẩu</title>
	<th:block layout:fragment="head">
		<link rel="stylesheet" th:href="@{/css/auth.css}">
	</th:block>
</head>
<body>
	<main class="container flex-grow-1 py-5 profile-page" layout:fragment="content">
		<div class="row g-4">
			<aside class="col-md-3"><div th:replace="~{profile/_nav :: profileNav('password')}"></div></aside>
			<div class="col-md-9" style="max-width: 520px">
				<h1 class="h3 mb-3">Đổi mật khẩu</h1>
				<p>Vui lòng đổi mật khẩu để tiếp tục sử dụng tài khoản.</p>
				<section class="card profile-form-panel">
					<div class="card-body">
						<form th:action="@{/profile/change-password}" th:object="${changePasswordRequest}" method="post" novalidate>
							<div class="mb-3">
								<label class="form-label" for="currentPassword">Mật khẩu hiện tại</label>
								<div class="password-field">
									<input class="form-control" id="currentPassword" type="password" th:field="*{currentPassword}" autocomplete="current-password">
									<button class="password-visibility-toggle" type="button" data-password-toggle
											aria-controls="currentPassword" aria-label="Hiện mật khẩu" aria-pressed="false">
										<i class="bi bi-eye" aria-hidden="true"></i>
									</button>
								</div>
								<div class="text-danger small" th:errors="*{currentPassword}"></div>
							</div>
							<div class="mb-3">
								<label class="form-label" for="newPassword">Mật khẩu mới</label>
								<div class="password-field">
									<input class="form-control" id="newPassword" type="password" th:field="*{newPassword}" autocomplete="new-password">
									<button class="password-visibility-toggle" type="button" data-password-toggle
											aria-controls="newPassword" aria-label="Hiện mật khẩu" aria-pressed="false">
										<i class="bi bi-eye" aria-hidden="true"></i>
									</button>
								</div>
								<div class="text-danger small" th:errors="*{newPassword}"></div>
							</div>
							<div class="mb-3">
								<label class="form-label" for="confirmPassword">Xác nhận mật khẩu mới</label>
								<div class="password-field">
									<input class="form-control" id="confirmPassword" type="password" th:field="*{confirmPassword}" autocomplete="new-password">
									<button class="password-visibility-toggle" type="button" data-password-toggle
											aria-controls="confirmPassword" aria-label="Hiện mật khẩu" aria-pressed="false">
										<i class="bi bi-eye" aria-hidden="true"></i>
									</button>
								</div>
								<div class="text-danger small" th:errors="*{confirmPassword}"></div>
								<div class="text-danger small" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
							</div>
							<button class="btn btn-primary w-100" type="submit">Cập nhật mật khẩu</button>
						</form>
					</div>
				</section>
			</div>
		</div>
	</main>
</body>
</html>
