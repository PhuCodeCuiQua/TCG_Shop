<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/dashboard}">
<head>
	<title>Quản lý series</title>
</head>
<body>
<main class="container-fluid flex-grow-1 p-3 p-lg-4" layout:fragment="content">
	<div th:replace="~{fragments/breadcrumb :: breadcrumb(items=${breadcrumbItems})}"></div>

	<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
		<h1 class="h4 mb-0">Quản lý series</h1>
		<a class="btn btn-primary" th:href="@{/manager/series/new(gameId=${gameId})}">Thêm series</a>
	</div>

	<div class="alert alert-success" role="alert" th:if="${successMessage}" th:text="${successMessage}"></div>

	<form class="row g-2 mb-3" method="get" th:action="@{/manager/series}">
		<div class="col-12 col-md-6">
			<input type="text" class="form-control" name="keyword" th:value="${keyword}"
				   placeholder="Tìm theo tên hoặc mã series">
		</div>
		<div class="col-12 col-md-6">
			<select class="form-select" name="gameId">
				<option value="">Tất cả game</option>
				<option th:each="g : ${games}" th:value="${g.id()}" th:text="${g.name()}"
						th:selected="${gameId != null and gameId == g.id()}">Pokémon</option>
			</select>
		</div>
		<div class="col-12 col-md-6">
			<select class="form-select" name="active">
				<option value="">Tất cả trạng thái</option>
				<option value="true" th:selected="${active != null and active}">Đang hiện</option>
				<option value="false" th:selected="${active != null and !active}">Đang ẩn</option>
			</select>
		</div>
		<div class="col-12 col-md-6 col-lg-2">
			<button class="btn btn-outline-primary w-100" type="submit">Lọc</button>
		</div>
	</form>

	<div class="card" th:if="${!seriesPage.content().isEmpty()}">
		<div class="table-responsive">
			<table class="table table-hover align-middle mb-0">
				<thead class="table-light">
				<tr>
					<th>Game</th>
					<th>Tên series</th>
					<th>Mã</th>
					<th>Ngày phát hành</th>
					<th>Trạng thái</th>
					<th class="text-end">Thao tác</th>
				</tr>
				</thead>
				<tbody>
				<tr th:each="s : ${seriesPage.content()}">
					<td th:text="${s.gameName()}">Pokémon</td>
					<td th:text="${s.name()}">Scarlet &amp; Violet</td>
					<td><code th:text="${s.code()}">SV1</code></td>
					<td th:text="${s.releaseDate() != null} ? ${#temporals.format(s.releaseDate(), 'dd/MM/yyyy')} : '-'">-</td>
					<td>
						<span class="badge bg-success" th:if="${s.active()}">Đang hiện</span>
						<span class="badge bg-secondary" th:unless="${s.active()}">Đang ẩn</span>
					</td>
					<td class="text-end">
						<div class="d-inline-flex flex-wrap gap-1 justify-content-end">
							<a class="btn btn-sm btn-outline-primary"
							   th:href="@{/manager/series/{id}/edit(id=${s.id()})}">Sửa</a>
							<form method="post" th:action="@{/manager/series/{id}/active(id=${s.id()})}">
								<input type="hidden" name="value" th:value="${!s.active()}">
								<button class="btn btn-sm btn-outline-warning" type="submit"
										th:text="${s.active()} ? 'Ẩn' : 'Hiện'">Ẩn</button>
							</form>
							<form method="post" th:action="@{/manager/series/{id}/delete(id=${s.id()})}"
								  data-confirm-catalog-delete
								  data-confirm-message="Xóa series này? Nếu còn thẻ hoặc sản phẩm liên quan, series sẽ chỉ bị ẩn.">
								<button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
							</form>
						</div>
					</td>
				</tr>
				</tbody>
			</table>
		</div>
	</div>

	<div class="text-center text-muted py-5" th:if="${seriesPage.content().isEmpty()}">
		Không có series nào phù hợp.
	</div>

	<nav class="mt-3" aria-label="Phân trang" th:if="${seriesPage.totalPages() > 1}">
		<ul class="pagination justify-content-center mb-0">
			<li class="page-item" th:classappend="${seriesPage.first()} ? 'disabled' : ''">
				<a class="page-link"
				   th:href="@{/manager/series(page=${seriesPage.page() - 1}, keyword=${keyword}, gameId=${gameId}, active=${active})}">Trước</a>
			</li>
			<li class="page-item" th:each="p : ${#numbers.sequence(0, seriesPage.totalPages() - 1)}"
				th:classappend="${p == seriesPage.page()} ? 'active' : ''">
				<a class="page-link" th:text="${p + 1}"
				   th:href="@{/manager/series(page=${p}, keyword=${keyword}, gameId=${gameId}, active=${active})}">1</a>
			</li>
			<li class="page-item" th:classappend="${seriesPage.last()} ? 'disabled' : ''">
				<a class="page-link"
				   th:href="@{/manager/series(page=${seriesPage.page() + 1}, keyword=${keyword}, gameId=${gameId}, active=${active})}">Sau</a>
			</li>
		</ul>
	</nav>
</main>
<th:block layout:fragment="scripts">
	<script th:src="@{/js/manager-catalog-actions.js}" defer></script>
</th:block>
</body>
</html>
