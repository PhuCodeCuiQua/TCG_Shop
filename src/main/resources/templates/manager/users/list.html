<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/dashboard}">
<head>
	<title>Quản lý người dùng</title>
</head>
<body>
<main class="container-fluid flex-grow-1 p-3 p-lg-4" layout:fragment="content">
	<div th:replace="~{fragments/breadcrumb :: breadcrumb(items=${breadcrumbItems})}"></div>

	<h1 class="h4 mb-3">Quản lý người dùng</h1>
	<div class="alert alert-success" role="alert" th:if="${successMessage}" th:text="${successMessage}"></div>

	<form class="row g-2 mb-3" method="get" th:action="@{/manager/users}">
		<div class="col-12 col-md-6 col-lg-5">
			<input type="search" class="form-control" name="keyword" th:value="${keyword}"
				   placeholder="Tìm theo họ tên hoặc email">
		</div>
		<div class="col-12 col-md-6 col-lg-3">
			<select class="form-select" name="role">
				<option value="">Tất cả vai trò</option>
				<option th:each="role : ${roles}" th:value="${role.name()}" th:text="${role.displayName}"
						th:selected="${selectedRole == role}">Người dùng</option>
			</select>
		</div>
		<div class="col-12 col-md-6 col-lg-2">
			<select class="form-select" name="status">
				<option value="">Tất cả trạng thái</option>
				<option th:each="statusOption : ${statuses}" th:value="${statusOption.name()}"
						th:text="${statusOption.displayName}"
						th:selected="${selectedStatus == statusOption}">Đang hoạt động</option>
			</select>
		</div>
		<div class="col-12 col-md-6 col-lg-2">
			<button class="btn btn-outline-primary w-100" type="submit">Tìm kiếm</button>
		</div>
	</form>

	<div class="card" th:if="${!usersPage.content().isEmpty()}">
		<div class="table-responsive">
			<table class="table table-hover align-middle mb-0">
				<thead class="table-light">
				<tr>
					<th>Người dùng</th>
					<th>Điện thoại</th>
					<th>Vai trò</th>
					<th>Trạng thái</th>
					<th class="text-end">Chi tiết</th>
				</tr>
				</thead>
				<tbody>
				<tr th:each="user : ${usersPage.content()}">
					<td>
						<div class="fw-semibold" th:text="${user.fullName()}">Nguyễn Văn A</div>
						<div class="small text-muted" th:text="${user.email()}">user@example.com</div>
					</td>
					<td th:text="${user.phoneNumber() != null} ? ${user.phoneNumber()} : '-'">-</td>
					<td>
						<span class="badge text-bg-light me-1" th:each="role : ${user.roles()}"
							  th:text="${role.displayName}">Người dùng</span>
					</td>
					<td>
						<span class="badge"
							  th:classappend="${user.status().name() == 'ACTIVE'} ? ' text-bg-success' : (${user.status().name() == 'BLOCKED'} ? ' text-bg-danger' : ' text-bg-secondary')"
							  th:text="${user.statusDisplayName()}">Đang hoạt động</span>
					</td>
					<td class="text-end">
						<a class="btn btn-sm btn-outline-primary"
						   th:href="@{/manager/users/{id}(id=${user.id()})}">Xem</a>
					</td>
				</tr>
				</tbody>
			</table>
		</div>
	</div>

	<div class="text-center text-muted py-5" th:if="${usersPage.content().isEmpty()}">
		Không tìm thấy người dùng phù hợp.
	</div>

	<nav class="mt-3" aria-label="Phân trang" th:if="${usersPage.totalPages() > 1}">
		<ul class="pagination justify-content-center mb-0">
			<li class="page-item" th:classappend="${usersPage.first()} ? 'disabled' : ''">
				<a class="page-link" th:href="@{/manager/users(page=${usersPage.page() - 1}, keyword=${keyword}, role=${selectedRole}, status=${selectedStatus})}">Trước</a>
			</li>
			<li class="page-item" th:each="p : ${#numbers.sequence(0, usersPage.totalPages() - 1)}"
				th:classappend="${p == usersPage.page()} ? 'active' : ''">
				<a class="page-link" th:text="${p + 1}"
				   th:href="@{/manager/users(page=${p}, keyword=${keyword}, role=${selectedRole}, status=${selectedStatus})}">1</a>
			</li>
			<li class="page-item" th:classappend="${usersPage.last()} ? 'disabled' : ''">
				<a class="page-link" th:href="@{/manager/users(page=${usersPage.page() + 1}, keyword=${keyword}, role=${selectedRole}, status=${selectedStatus})}">Sau</a>
			</li>
		</ul>
	</nav>
</main>
</body>
</html>
