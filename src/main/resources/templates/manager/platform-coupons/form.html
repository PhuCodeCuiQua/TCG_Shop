<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/dashboard}">
<head>
	<title th:text="${formTitle}">Mã giảm giá</title>
</head>
<body>
<main class="container-fluid flex-grow-1 p-3 p-lg-4" layout:fragment="content">
	<div th:replace="~{fragments/breadcrumb :: breadcrumb(items=${breadcrumbItems})}"></div>
	<h1 class="h4 mb-3" th:text="${formTitle}">Mã giảm giá toàn sàn</h1>
	<form class="card card-body" style="max-width: 760px;" method="post"
		  th:action="@{${formAction}}" th:object="${couponRequest}">
		<input type="hidden" name="couponId" th:value="${couponId}">
		<div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
			<div th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
		</div>
		<div class="row g-3">
			<div class="col-12 col-md-6">
				<label class="form-label" for="code">Mã giảm giá</label>
				<input class="form-control text-uppercase" id="code" th:field="*{code}" maxlength="50"
					   pattern="[A-Za-z0-9_-]+" required th:classappend="${#fields.hasErrors('code')} ? 'is-invalid' : ''">
				<div class="invalid-feedback" th:errors="*{code}"></div>
			</div>
			<div class="col-12 col-md-6">
				<label class="form-label" for="discountType">Loại giảm</label>
				<select class="form-select" id="discountType" th:field="*{discountType}" required>
					<option value="">-- Chọn loại --</option>
					<option th:each="option : ${discountTypes}" th:value="${option.name()}"
							th:text="${option.displayName}">Loại</option>
				</select>
				<div class="invalid-feedback" th:errors="*{discountType}"></div>
			</div>
			<div class="col-12 col-md-6">
				<label class="form-label" for="discountValue">Giá trị giảm</label>
				<input class="form-control" id="discountValue" type="number" min="0.01" step="0.01"
					   th:field="*{discountValue}" required th:classappend="${#fields.hasErrors('discountValue')} ? 'is-invalid' : ''">
				<div class="form-text">Nếu chọn phần trăm, giá trị không được vượt quá 100.</div>
				<div class="invalid-feedback" th:errors="*{discountValue}"></div>
			</div>
			<div class="col-12 col-md-6">
				<label class="form-label" for="maxDiscountAmount">Mức giảm tối đa (không bắt buộc)</label>
				<input class="form-control" id="maxDiscountAmount" type="number" min="0.01" step="0.01"
					   th:field="*{maxDiscountAmount}" th:classappend="${#fields.hasErrors('maxDiscountAmount')} ? 'is-invalid' : ''">
				<div class="invalid-feedback" th:errors="*{maxDiscountAmount}"></div>
			</div>
			<div class="col-12 col-md-6">
				<label class="form-label" for="minOrderValue">Đơn hàng tối thiểu</label>
				<input class="form-control" id="minOrderValue" type="number" min="0" step="0.01"
					   th:field="*{minOrderValue}" th:classappend="${#fields.hasErrors('minOrderValue')} ? 'is-invalid' : ''">
				<div class="invalid-feedback" th:errors="*{minOrderValue}"></div>
			</div>
			<div class="col-12 col-md-6">
				<label class="form-label" for="totalQuantity">Tổng lượt sử dụng (để trống nếu không giới hạn)</label>
				<input class="form-control" id="totalQuantity" type="number" min="1" step="1" th:field="*{totalQuantity}">
				<div class="invalid-feedback" th:errors="*{totalQuantity}"></div>
			</div>
			<div class="col-12 col-md-6">
				<label class="form-label" for="limitPerUser">Lượt dùng tối đa mỗi người</label>
				<input class="form-control" id="limitPerUser" type="number" min="1" step="1"
					   th:field="*{limitPerUser}" required th:classappend="${#fields.hasErrors('limitPerUser')} ? 'is-invalid' : ''">
				<div class="invalid-feedback" th:errors="*{limitPerUser}"></div>
			</div>
			<div class="col-12 col-md-6">
				<label class="form-label" for="status">Trạng thái</label>
				<select class="form-select" id="status" th:field="*{status}" required>
					<option th:each="option : ${activeStatuses}" th:value="${option.name()}"
							th:text="${option.displayName}">Trạng thái</option>
				</select>
			</div>
			<div class="col-12 col-md-6">
				<label class="form-label" for="startDate">Bắt đầu</label>
				<input class="form-control" id="startDate" type="datetime-local" step="60"
					   th:field="*{startDate}" required th:classappend="${#fields.hasErrors('startDate')} ? 'is-invalid' : ''">
				<div class="invalid-feedback" th:errors="*{startDate}"></div>
			</div>
			<div class="col-12 col-md-6">
				<label class="form-label" for="endDate">Kết thúc</label>
				<input class="form-control" id="endDate" type="datetime-local" step="60"
					   th:field="*{endDate}" required th:classappend="${#fields.hasErrors('endDate')} ? 'is-invalid' : ''">
				<div class="invalid-feedback" th:errors="*{endDate}"></div>
			</div>
		</div>
		<div class="d-flex gap-2 mt-4">
			<button class="btn btn-primary" type="submit">Lưu mã giảm giá</button>
			<a class="btn btn-outline-secondary" th:href="@{${basePath}}">Hủy</a>
		</div>
	</form>
</main>
</body>
</html>
