<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/dashboard}">
<head>
	<title th:text="${pageTitle}">Dashboard</title>
</head>
<body>
<main class="container-fluid flex-grow-1 p-3 p-lg-4 admin-dashboard manager-dashboard-theme" layout:fragment="content">
	<div th:replace="~{fragments/breadcrumb :: breadcrumb(items=${breadcrumbItems})}"></div>
	<div class="dashboard-heading mb-4">
		<span class="dashboard-eyebrow">MIDNIGHT RARE · TỔNG QUAN</span>
		<h1 class="h3 mb-1" th:text="${pageTitle}">Dashboard</h1>
		<p class="text-muted mb-0">Theo dõi hoạt động của hệ thống trong khoảng thời gian đã chọn.</p>
	</div>

	<div id="dashboard" th:attr="data-api-base=${apiBase}">
		<form id="dash-filter" class="card dashboard-filter mb-3">
			<div class="card-body row g-3 align-items-end">
				<div class="col-12 col-sm-6 col-lg-3">
					<label class="form-label" for="dash-from">Từ ngày</label>
					<input type="date" class="form-control" id="dash-from" required>
				</div>
				<div class="col-12 col-sm-6 col-lg-3">
					<label class="form-label" for="dash-to">Đến ngày</label>
					<input type="date" class="form-control" id="dash-to" required>
				</div>
				<div class="col-12 col-sm-6 col-lg-3">
					<label class="form-label" for="dash-group">Doanh thu theo</label>
					<select class="form-select" id="dash-group">
						<option value="day">Ngày</option>
						<option value="month">Tháng</option>
					</select>
				</div>
				<div class="col-12 col-sm-6 col-lg-3">
					<button type="submit" class="btn btn-primary w-100" id="dash-apply">Áp dụng bộ lọc</button>
				</div>
			</div>
		</form>

		<div class="alert alert-danger d-none" id="dash-error" role="alert"></div>

		<div class="row row-cols-2 row-cols-xl-5 g-3 mb-3">
			<div class="col">
				<div class="card dashboard-stat-card h-100"><div class="card-body">
					<div class="dashboard-stat-label">Tổng người dùng</div><div class="dashboard-stat-value" id="card-users">-</div>
				</div></div>
			</div>
			<div class="col">
				<div class="card dashboard-stat-card h-100"><div class="card-body">
					<div class="dashboard-stat-label">Tổng chi nhánh</div><div class="dashboard-stat-value" id="card-shops">-</div>
				</div></div>
			</div>
			<div class="col">
				<div class="card dashboard-stat-card h-100"><div class="card-body">
					<div class="dashboard-stat-label">Đơn trong kỳ</div><div class="dashboard-stat-value" id="card-orders">-</div>
				</div></div>
			</div>
			<div class="col">
				<div class="card dashboard-stat-card h-100"><div class="card-body">
					<div class="dashboard-stat-label">Doanh thu hệ thống</div><div class="dashboard-stat-value" id="card-revenue">-</div>
				</div></div>
			</div>
			<div class="col" id="card-commission-wrap">
				<div class="card dashboard-stat-card h-100"><div class="card-body">
					<div class="dashboard-stat-label">
						<i class="bi bi-cash-coin dashboard-stat-commission-icon me-1" aria-hidden="true"></i>
						Hoa hồng nhận được
					</div>
					<div class="dashboard-stat-value dashboard-stat-commission-value" id="card-commission">-</div>
				</div></div>
			</div>
		</div>

		<div class="row g-3">
			<div class="col-12 col-xl-8"><section class="card dashboard-chart-card h-100"><div class="card-body">
				<h2 class="h6 dashboard-chart-title">Doanh thu</h2><canvas id="chart-revenue" height="120"></canvas>
			</div></section></div>
			<div class="col-12 col-xl-4"><section class="card dashboard-chart-card h-100"><div class="card-body">
				<h2 class="h6 dashboard-chart-title">Đơn theo trạng thái</h2><canvas id="chart-status" height="200"></canvas>
			</div></section></div>
			<div class="col-12 col-lg-6"><section class="card dashboard-chart-card h-100"><div class="card-body">
				<h2 class="h6 dashboard-chart-title">Top chi nhánh theo doanh thu</h2><canvas id="chart-shops" height="160"></canvas>
			</div></section></div>
			<div class="col-12 col-lg-6"><section class="card dashboard-chart-card h-100"><div class="card-body">
				<h2 class="h6 dashboard-chart-title">Top sản phẩm bán chạy</h2><canvas id="chart-products" height="160"></canvas>
			</div></section></div>
		</div>
	</div>
</main>
<th:block layout:fragment="scripts">
	<script th:src="@{/lib/chartjs/chart.umd.min.js}"></script>
	<script th:src="@{/js/system-dashboard.js}" defer></script>
</th:block>
</body>
</html>
