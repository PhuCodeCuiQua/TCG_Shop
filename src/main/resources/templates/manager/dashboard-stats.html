<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- TODO: bọc bằng layout giống templates/manager/users/list.html -->
<div class="container-fluid" id="dashboard" th:attr="data-api-base=${apiBase}">
	<h1 class="h4 mb-3" th:text="${pageTitle}">Dashboard</h1>

	<form id="dash-filter" class="row g-2 align-items-end mb-3">
		<div class="col-auto">
			<label class="form-label mb-0" for="dash-from">Từ ngày</label>
			<input type="date" class="form-control" id="dash-from" required>
		</div>
		<div class="col-auto">
			<label class="form-label mb-0" for="dash-to">Đến ngày</label>
			<input type="date" class="form-control" id="dash-to" required>
		</div>
		<div class="col-auto">
			<label class="form-label mb-0" for="dash-group">Doanh thu theo</label>
			<select class="form-select" id="dash-group">
				<option value="day">Ngày</option>
				<option value="month">Tháng</option>
			</select>
		</div>
		<div class="col-auto">
			<button type="submit" class="btn btn-primary" id="dash-apply">Áp dụng</button>
		</div>
	</form>

	<div class="alert alert-danger d-none" id="dash-error" role="alert"></div>

	<div class="row g-3 mb-3">
		<div class="col-6 col-lg"><div class="card"><div class="card-body">
			<div class="text-muted small">Tổng người dùng</div><div class="h4 mb-0" id="card-users">-</div></div></div></div>
		<div class="col-6 col-lg"><div class="card"><div class="card-body">
			<div class="text-muted small">Tổng shop</div><div class="h4 mb-0" id="card-shops">-</div></div></div></div>
		<div class="col-6 col-lg"><div class="card"><div class="card-body">
			<div class="text-muted small">Đơn trong kỳ</div><div class="h4 mb-0" id="card-orders">-</div></div></div></div>
		<div class="col-6 col-lg"><div class="card"><div class="card-body">
			<div class="text-muted small">Doanh thu sàn</div><div class="h4 mb-0" id="card-revenue">-</div></div></div></div>
		<div class="col-6 col-lg d-none" id="card-commission-wrap"><div class="card"><div class="card-body">
			<div class="text-muted small">Hoa hồng đã thu</div><div class="h4 mb-0" id="card-commission">-</div></div></div></div>
	</div>

	<div class="row g-3">
		<div class="col-lg-8"><div class="card"><div class="card-body">
			<h2 class="h6">Doanh thu</h2><canvas id="chart-revenue" height="120"></canvas></div></div></div>
		<div class="col-lg-4"><div class="card"><div class="card-body">
			<h2 class="h6">Đơn theo trạng thái</h2><canvas id="chart-status" height="200"></canvas></div></div></div>
		<div class="col-lg-6"><div class="card"><div class="card-body">
			<h2 class="h6">Top shop theo doanh thu</h2><canvas id="chart-shops" height="160"></canvas></div></div></div>
		<div class="col-lg-6"><div class="card"><div class="card-body">
			<h2 class="h6">Top sản phẩm bán chạy</h2><canvas id="chart-products" height="160"></canvas></div></div></div>
	</div>
</div>

<script th:src="@{/lib/chartjs/chart.umd.min.js}"></script>
<script th:src="@{/js/system-dashboard.js}"></script>
</body>
</html>
