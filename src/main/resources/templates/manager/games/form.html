<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/dashboard}">
<head>
	<title th:text="${formTitle}">Game</title>
</head>
<body>
<main class="container-fluid flex-grow-1 p-3 p-lg-4" layout:fragment="content">
	<div th:replace="~{fragments/breadcrumb :: breadcrumb(items=${breadcrumbItems})}"></div>

	<h1 class="h4 mb-3" th:text="${formTitle}">Thêm game</h1>

	<form class="card card-body" style="max-width: 640px;" method="post"
		  th:action="@{${formAction}}" th:object="${gameRequest}" novalidate>

		<div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
			<div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
		</div>

		<div class="mb-3">
			<label class="form-label" for="name">Tên game <span class="text-danger">*</span></label>
			<input type="text" class="form-control" id="name" th:field="*{name}" maxlength="100" required
				   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
			<div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
		</div>

		<div class="mb-3">
			<label class="form-label" for="code">Mã game <span class="text-danger">*</span></label>
			<input type="text" class="form-control" id="code" th:field="*{code}" maxlength="30" required
				   pattern="[A-Z0-9_]+" placeholder="VD: POKEMON"
				   th:classappend="${#fields.hasErrors('code')} ? 'is-invalid' : ''">
			<div class="form-text">Chỉ gồm chữ HOA, số và dấu gạch dưới.</div>
			<div class="invalid-feedback" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
		</div>

		<div class="mb-3">
			<label class="form-label" for="description">Mô tả</label>
			<textarea class="form-control" id="description" rows="4" maxlength="2000"
					  th:field="*{description}"
					  th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"></textarea>
			<div class="invalid-feedback" th:if="${#fields.hasErrors('description')}"
				 th:errors="*{description}"></div>
		</div>

		<div class="d-flex gap-2">
			<button class="btn btn-primary" type="submit">Lưu</button>
			<a class="btn btn-outline-secondary" th:href="@{/manager/games}">Hủy</a>
		</div>
	</form>
</main>
</body>
</html>
