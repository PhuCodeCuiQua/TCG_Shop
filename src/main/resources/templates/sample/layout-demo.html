<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/main}">
<head>
	<title>PG-02 Layout Demo</title>
</head>
<body>
<main layout:fragment="content" class="container py-4">
	<div th:replace="~{fragments/breadcrumb :: breadcrumb(items=${breadcrumbItems})}"></div>

	<section class="mb-5">
		<h1 class="h2">Thử nghiệm layout chính</h1>
		<p class="text-secondary">Trang mẫu kiểm tra header, footer, fragment và phân trang dùng chung.</p>
	</section>

	<section class="card mb-5">
		<div class="card-body">
			<h2 class="h5">Empty state</h2>
			<div th:replace="~{fragments/empty-state :: emptyState(message='Chưa có sản phẩm để hiển thị.')}"></div>
		</div>
	</section>

	<section class="card">
		<div class="card-body">
			<h2 class="h5">Phân trang mẫu</h2>
			<p class="text-secondary">Trang hiện tại: <span th:text="${page.number + 1}">1</span></p>
			<ul class="list-group list-group-flush mb-4">
				<li class="list-group-item" th:each="item : ${page.content}" th:text="${item}">Mục mẫu</li>
			</ul>
			<div th:replace="~{fragments/pagination :: pagination(page=${page})}"></div>
		</div>
	</section>
</main>
</body>
</html>
