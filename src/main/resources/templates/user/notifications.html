<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/main}">
<head>
	<title>Thông báo</title>
</head>
<body>
<main layout:fragment="content" class="container py-4">
	<div class="all-notifications-list mx-auto">
		<div class="d-flex flex-wrap align-items-end justify-content-between gap-2 mb-4">
			<div>
				<p class="text-primary fw-semibold small text-uppercase mb-1">Tài khoản</p>
				<h1 class="h3 mb-1">Tất cả thông báo</h1>
				<p class="text-muted mb-0">Các cập nhật mới nhất về đơn hàng và tài khoản của bạn.</p>
			</div>
			<a class="btn btn-outline-secondary btn-sm" th:href="@{/}">Về trang chủ</a>
		</div>

		<div id="allNotifications" data-page-size="10">
			<div id="allNotificationsList" class="list-group mb-3" aria-live="polite">
				<div class="list-group-item text-muted py-4 text-center">Đang tải thông báo...</div>
			</div>
			<nav aria-label="Phân trang thông báo">
				<ul id="allNotificationsPagination" class="pagination justify-content-center"></ul>
			</nav>
		</div>
	</div>
</main>
<th:block layout:fragment="scripts">
	<script th:src="@{/js/notifications-page.js}" defer></script>
</th:block>
</body>
</html>
