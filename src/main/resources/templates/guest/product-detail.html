<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- TODO: bọc bằng layout giống templates/index.html (header, footer, meta CSRF) -->
<main class="container py-4" id="product-detail" th:attr="data-product-id=${detail.id}">
	<div class="row g-4">
		<div class="col-md-5">
			<img th:if="${detail.imageUrl}" th:src="${detail.imageUrl}" th:alt="${detail.name}" class="img-fluid rounded w-100">
			<div th:unless="${detail.imageUrl}" class="bg-light rounded d-flex align-items-center justify-content-center" style="height:420px">Chưa có ảnh</div>
		</div>

		<div class="col-md-7">
			<h1 class="h3" th:text="${detail.name}">Tên sản phẩm</h1>

			<div th:if="${detail.singleCard}" class="text-muted mb-2">
				<span th:if="${detail.gameName}" th:text="${detail.gameName}"></span>
				<span th:if="${detail.seriesName}"> · <span th:text="${detail.seriesName}"></span></span>
				<span th:if="${detail.cardNumber}"> · Số thẻ <span th:text="${detail.cardNumber}"></span></span>
				<span th:if="${detail.rarity}"> · <span th:text="${detail.rarity}"></span></span>
			</div>

			<div class="mb-3" th:if="${detail.singleCard}">
				<div>Giá thị trường: <b th:text="${detail.marketPrice != null} ? ${#numbers.formatDecimal(detail.marketPrice, 0, 'POINT', 0, 'COMMA')} + ' ₫' : 'Chưa có'"></b></div>
				<div>Giá thấp nhất: <b th:text="${detail.lowestPrice != null} ? ${#numbers.formatDecimal(detail.lowestPrice, 0, 'POINT', 0, 'COMMA')} + ' ₫' : 'Hết hàng'"></b></div>
			</div>

			<p class="mb-3" th:unless="${detail.singleCard}" th:text="${detail.description}"></p>

			<div class="mb-3">
				<span class="h4 text-danger" id="pd-price" th:text="${#numbers.formatDecimal(detail.effectivePrice, 0, 'POINT', 0, 'COMMA')} + ' ₫'"></span>
				<span class="text-muted ms-2" id="pd-old-price"
					th:if="${detail.effectivePrice != null and detail.price != null and detail.effectivePrice.compareTo(detail.price) &lt; 0}">
					<s th:text="${#numbers.formatDecimal(detail.price, 0, 'POINT', 0, 'COMMA')} + ' ₫'"></s>
				</span>
			</div>

			<div class="row g-2 mb-3" th:if="${detail.singleCard}">
				<div class="col-sm-4">
					<label class="form-label" for="pd-condition">Tình trạng</label>
					<select class="form-select" id="pd-condition"><option value="">Tất cả</option></select>
				</div>
				<div class="col-sm-4">
					<label class="form-label" for="pd-language">Ngôn ngữ</label>
					<select class="form-select" id="pd-language"><option value="">Tất cả</option></select>
				</div>
				<div class="col-sm-4">
					<label class="form-label" for="pd-offer">Người bán</label>
					<select class="form-select" id="pd-offer"></select>
				</div>
			</div>

			<div class="mb-3" th:unless="${detail.singleCard}">
				<span class="text-muted">Người bán: </span><b th:text="${detail.shopName}"></b>
			</div>

			<div class="mb-2 text-muted">
				Còn lại: <b id="pd-stock" th:text="${detail.stock}"></b> · Đã bán: <span th:text="${detail.soldCount}"></span>
			</div>

			<div class="d-flex gap-2 align-items-center mb-2">
				<input type="number" class="form-control" id="pd-qty" value="1" min="1" style="width:100px" aria-label="Số lượng">
				<button type="button" class="btn btn-primary" id="pd-add" th:disabled="${!detail.inStock}">Thêm vào giỏ</button>
			</div>
			<div class="alert d-none" id="pd-message" role="alert"></div>
			<div class="text-danger" id="pd-soldout" th:classappend="${detail.inStock} ? 'd-none'">Sản phẩm đã hết hàng</div>
		</div>
	</div>

	<!-- PA-36: biểu đồ giá (gọi GET /api/cards/{id}/price-history) -->
	<section class="mt-5" th:if="${detail.singleCard}" id="price-chart-section" th:attr="data-card-id=${detail.cardId}"></section>

	<!-- PA-35: bảng so sánh Vendor -->
	<section class="mt-4" th:if="${detail.singleCard}" id="vendor-offers-section" th:attr="data-card-id=${detail.cardId}"></section>

	<!-- TODO(PG-29): nhúng fragments/reviews :: reviewSection(product, reviews, canReview) của Phong khi đã merge -->
	<section class="mt-5" id="reviews-section"></section>
</main>

<script th:inline="javascript">
	window.PRODUCT_OFFERS = /*[[${detail.offers}]]*/ [];
	window.CURRENT_PRODUCT_ID = /*[[${detail.id}]]*/ 0;
	window.IS_SINGLE_CARD = /*[[${detail.singleCard}]]*/ false;
	window.CURRENT_STOCK = /*[[${detail.stock}]]*/ 0;
</script>
<script th:src="@{/js/product-detail.js}"></script>
<script th:src="@{/js/vendor-offers.js}"></script>
</body>
</html>
