<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title th:text="${heading}">Thông báo từ TCG Shop</title>
</head>
<body style="margin:0;padding:24px;background-color:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#263238;">
	<table role="presentation" style="width:100%;max-width:560px;margin:0 auto;background:#ffffff;border-collapse:collapse;border-radius:8px;">
		<tr><td style="padding:32px 28px;">
			<h1 style="margin:0 0 20px;font-size:22px;line-height:1.4;color:#17324d;" th:text="${heading}">Thông báo</h1>
			<div th:each="paragraph : ${paragraphs}">
				<p style="margin:0 0 14px;font-size:15px;line-height:1.7;white-space:pre-line;" th:text="${paragraph}">Nội dung thông báo</p>
			</div>
			<p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#59636e;">Trân trọng,<br>TCG Shop</p>
		</td></tr>
	</table>
</body>
</html>
