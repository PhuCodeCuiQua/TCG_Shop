<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title th:text="${heading}">Xác nhận tài khoản</title>
</head>
<body style="margin:0;padding:24px;background-color:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#263238;">
	<table role="presentation" style="width:100%;max-width:560px;margin:0 auto;background:#ffffff;border-collapse:collapse;border-radius:8px;">
		<tr><td style="padding:32px 28px;">
			<h1 style="margin:0 0 20px;font-size:22px;line-height:1.4;color:#17324d;" th:text="${heading}">Xác nhận đăng ký tài khoản</h1>
			<p style="margin:0 0 16px;font-size:16px;line-height:1.6;">Xin chào <strong th:text="${fullName}">bạn</strong>,</p>
			<p style="margin:0 0 12px;font-size:15px;line-height:1.6;">Mã xác thực của bạn là:</p>
			<p style="margin:0 0 20px;padding:16px;text-align:center;background:#f0f5fa;border-radius:6px;font-size:32px;font-weight:bold;letter-spacing:8px;color:#145da0;" th:text="${otp}">000000</p>
			<p style="margin:0 0 12px;font-size:15px;line-height:1.6;">Mã có hiệu lực trong <strong th:text="${validMinutes}">5</strong> phút.</p>
			<p style="margin:0 0 12px;font-size:14px;line-height:1.6;color:#a33;">Vui lòng không chia sẻ mã này với bất kỳ ai.</p>
			<p style="margin:0;font-size:14px;line-height:1.6;color:#59636e;">Nếu bạn không thực hiện yêu cầu này, hãy bỏ qua email.</p>
		</td></tr>
	</table>
</body>
</html>
