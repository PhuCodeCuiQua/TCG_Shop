<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Đăng nhập - TCG Shop</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 480px">
	<h1 class="h3 mb-4">Đăng nhập</h1>
	<div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
	<div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
	<form th:action="@{/auth/login}" th:object="${loginRequest}" method="post" novalidate>
		<input type="hidden" th:field="*{returnUrl}">
		<div class="mb-3">
			<label class="form-label" for="email">Email</label>
			<input class="form-control" id="email" type="email" th:field="*{email}" autocomplete="email">
			<div class="text-danger small" th:errors="*{email}"></div>
		</div>
		<div class="mb-3">
			<label class="form-label" for="password">Mật khẩu</label>
			<input class="form-control" id="password" type="password" th:field="*{password}" autocomplete="current-password">
			<div class="text-danger small" th:errors="*{password}"></div>
		</div>
		<button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
	</form>
	<div class="d-flex justify-content-between mt-3">
		<a th:href="@{/auth/forgot-password}">Quên mật khẩu</a>
		<a th:href="@{/auth/register}">Đăng ký</a>
	</div>
</main>
</body>
</html>
