<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/main}">
<head>
	<title>Đăng nhập</title>
	<th:block layout:fragment="head">
		<link rel="stylesheet" th:href="@{/css/auth.css}">
	</th:block>
</head>
<body>
<section layout:fragment="content" class="auth-page">
	<div class="row auth-layout justify-content-center">
		<div class="col-12 auth-shell">
			<div class="card auth-panel">
				<div class="card-body auth-panel__body">
					<div class="auth-brandline">
						<span class="auth-brandline__spark" aria-hidden="true">✦</span>
						<span>TCG Shop · Sưu tầm thẻ bài chính hãng</span>
						<span class="auth-brandline__spark" aria-hidden="true">✦</span>
					</div>
					<div class="auth-heading">
						<h1>Đăng nhập</h1>
						<p>Chào mừng bạn quay lại TCG Shop</p>
					</div>
					<form th:action="@{/auth/login}" th:object="${loginRequest}" method="post">
						<div class="alert alert-info" role="status"
							 th:if="${param.returnUrl != null and #strings.startsWith(param.returnUrl[0], '/profile')}">
							Vui lòng đăng nhập để xem hồ sơ và thay đổi ảnh đại diện.
						</div>
						<input th:if="${param.returnUrl}" type="hidden" name="returnUrl"
							   th:value="${param.returnUrl}">
						<div class="mb-3">
							<label class="form-label" for="email">Email</label>
							<input class="form-control" id="email" type="email" th:field="*{email}"
								   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
								   autocomplete="email" required>
							<div class="invalid-feedback d-block" th:errors="*{email}"></div>
						</div>
						<div class="mb-3">
							<label class="form-label" for="password">Mật khẩu</label>
							<input class="form-control" id="password" type="password" th:field="*{password}"
								   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
								   autocomplete="current-password" required>
							<div class="invalid-feedback d-block" th:errors="*{password}"></div>
						</div>
						<div class="d-flex justify-content-end mb-3">
							<a th:href="@{/auth/forgot-password}">Quên mật khẩu?</a>
						</div>
						<button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
					</form>
					<p class="auth-divider-note text-center text-secondary mt-4 mb-0">
						Chưa có tài khoản? <a th:href="@{/auth/register}">Đăng ký</a>
					</p>
				</div>
			</div>
		</div>
	</div>
</section>
</body>
</html>
