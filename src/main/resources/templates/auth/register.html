<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Đăng ký - TCG Shop</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 640px">
	<h1 class="h3 mb-4">Tạo tài khoản</h1>
	<div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
	<form th:action="@{/auth/register}" th:object="${registerRequest}" method="post" novalidate>
		<div class="mb-3">
			<label class="form-label" for="fullName">Họ và tên</label>
			<input class="form-control" id="fullName" type="text" th:field="*{fullName}" autocomplete="name">
			<div class="text-danger small" th:errors="*{fullName}"></div>
		</div>
		<div class="mb-3">
			<label class="form-label" for="email">Email</label>
			<input class="form-control" id="email" type="email" th:field="*{email}" autocomplete="email">
			<div class="text-danger small" th:errors="*{email}"></div>
		</div>
		<div class="mb-3">
			<label class="form-label" for="phoneNumber">Số điện thoại</label>
			<input class="form-control" id="phoneNumber" type="tel" th:field="*{phoneNumber}" autocomplete="tel">
			<div class="text-danger small" th:errors="*{phoneNumber}"></div>
		</div>
		<div class="mb-3">
			<label class="form-label" for="password">Mật khẩu</label>
			<input class="form-control" id="password" type="password" th:field="*{password}" autocomplete="new-password">
			<div class="text-danger small" th:errors="*{password}"></div>
		</div>
		<div class="mb-3">
			<label class="form-label" for="confirmPassword">Xác nhận mật khẩu</label>
			<input class="form-control" id="confirmPassword" type="password" th:field="*{confirmPassword}" autocomplete="new-password">
			<div class="text-danger small" th:errors="*{confirmPassword}"></div>
			<div class="text-danger small" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
		</div>
		<button class="btn btn-primary w-100" type="submit">Đăng ký</button>
	</form>
</main>
</body>
</html>
