<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/main}">
<head>
	<title>Quên mật khẩu</title>
	<th:block layout:fragment="head">
		<link rel="stylesheet" th:href="@{/css/auth.css}">
	</th:block>
</head>
<body>
<section layout:fragment="content" class="auth-page">
	<div class="row auth-layout justify-content-center">
		<div class="col-12 auth-shell">
			<div class="card auth-panel">
				<div class="card-body auth-panel__body">
					<div class="auth-brandline">
						<span class="auth-brandline__spark" aria-hidden="true">✦</span>
						<span>TCG Shop · Khôi phục tài khoản</span>
						<span class="auth-brandline__spark" aria-hidden="true">✦</span>
					</div>
					<div class="auth-heading">
						<h1>Quên mật khẩu</h1>
						<p>Nhập email để nhận mã xác nhận đặt lại mật khẩu.</p>
					</div>
					<form th:action="@{/auth/forgot-password}" th:object="${forgotPasswordRequest}"
						  method="post">
						<div class="mb-3">
							<label class="form-label" for="email">Email</label>
							<input class="form-control" id="email" type="email" th:field="*{email}"
								   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
								   autocomplete="email" required>
							<div class="invalid-feedback d-block" th:errors="*{email}"></div>
						</div>
						<button class="btn btn-primary w-100" type="submit">Gửi mã xác nhận</button>
					</form>
					<p class="auth-divider-note text-center mt-4 mb-0">
						<a th:href="@{/auth/login}">Quay lại đăng nhập</a>
					</p>
				</div>
			</div>
		</div>
	</div>
</section>
</body>
</html>
