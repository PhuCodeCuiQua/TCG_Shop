<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Xác thực email - TCG Shop</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 560px">
	<h1 class="h3 mb-3">Xác thực email</h1>
	<p class="text-secondary">Mã xác nhận có hiệu lực trong <strong th:text="${validMinutes}">5</strong> phút.</p>
	<div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
	<form th:action="@{/auth/verify-otp}" th:object="${verifyOtpRequest}" method="post" novalidate>
		<div class="mb-3">
			<label class="form-label" for="email">Email</label>
			<input class="form-control" id="email" type="email" th:field="*{email}">
			<div class="text-danger small" th:errors="*{email}"></div>
		</div>
		<div class="mb-3">
			<label class="form-label" for="otp">Mã OTP</label>
			<input class="form-control" id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" th:field="*{otp}">
			<div class="text-danger small" th:errors="*{otp}"></div>
		</div>
		<button class="btn btn-primary w-100" type="submit">Xác thực</button>
	</form>
	<hr class="my-4">
	<form th:action="@{/auth/resend-otp}" th:object="${resendOtpRequest}" method="post">
		<input type="hidden" th:field="*{email}">
		<div class="text-danger small mb-2" th:errors="*{email}"></div>
		<button class="btn btn-outline-secondary w-100" type="submit">Gửi lại mã</button>
	</form>
</main>
</body>
</html>
