<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/main}">
<head>
	<title>Đặt lại mật khẩu</title>
	<th:block layout:fragment="head">
		<link rel="stylesheet" th:href="@{/css/auth.css}">
	</th:block>
</head>
<body>
<section layout:fragment="content" class="auth-page">
	<div class="row auth-layout justify-content-center">
		<div class="col-12 auth-shell auth-shell--wide">
			<div class="card auth-panel">
				<div class="card-body auth-panel__body">
					<div class="auth-brandline">
						<span class="auth-brandline__spark" aria-hidden="true">✦</span>
						<span>TCG Shop · Thiết lập bảo mật mới</span>
						<span class="auth-brandline__spark" aria-hidden="true">✦</span>
					</div>
					<div class="auth-heading">
						<h1>Đặt lại mật khẩu</h1>
						<p>Nhập mã xác nhận và tạo mật khẩu mới.</p>
					</div>
					<form th:action="@{/auth/reset-password}" th:object="${resetPasswordRequest}"
						  method="post">
						<div class="mb-3">
							<label class="form-label" for="email">Email</label>
							<input class="form-control" id="email" type="email" th:field="*{email}"
								   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
								   autocomplete="email" required>
							<div class="invalid-feedback d-block" th:errors="*{email}"></div>
						</div>
						<div class="mb-3">
							<label class="form-label" for="otp">Mã OTP</label>
							<input class="form-control" id="otp" type="text" inputmode="numeric"
								   autocomplete="one-time-code" minlength="6" maxlength="6" pattern="[0-9]{6}"
								   title="Mã OTP gồm đúng 6 chữ số" th:field="*{otp}"
								   th:classappend="${#fields.hasErrors('otp')} ? 'is-invalid' : ''" required>
							<div class="invalid-feedback d-block" th:errors="*{otp}"></div>
						</div>
						<div class="mb-3" data-strength-container>
							<label class="form-label" for="newPassword">Mật khẩu mới</label>
							<div class="password-field">
								<input class="form-control" id="newPassword" type="password" th:field="*{newPassword}"
									   th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid' : ''"
									   autocomplete="new-password" minlength="8" maxlength="64"
									   data-password-strength required>
								<button class="password-visibility-toggle" type="button" data-password-toggle
										aria-controls="newPassword" aria-label="Hiện mật khẩu" aria-pressed="false">
									<i class="bi bi-eye" aria-hidden="true"></i>
								</button>
							</div>
							<div class="invalid-feedback d-block" th:errors="*{newPassword}"></div>
							<div class="progress mt-2" role="progressbar" aria-label="Độ mạnh mật khẩu"
								 aria-valuemin="0" aria-valuemax="5" aria-valuenow="0">
								<div class="progress-bar bg-danger" data-strength-meter style="width: 0"></div>
							</div>
							<div class="form-text" aria-live="polite" data-strength-label>
								Độ mạnh mật khẩu: chưa nhập
							</div>
							<div class="form-text">Cần ít nhất 8 ký tự, chữ hoa, chữ thường, số và ký tự đặc biệt.</div>
							<div class="form-text">Kiểm tra này chỉ hỗ trợ người dùng; máy chủ mới là nơi quyết định.</div>
						</div>
						<div class="mb-3">
							<label class="form-label" for="confirmPassword">Xác nhận mật khẩu mới</label>
							<div class="password-field">
								<input class="form-control" id="confirmPassword" type="password" th:field="*{confirmPassword}"
									   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
									   autocomplete="new-password" minlength="8" maxlength="64" required>
								<button class="password-visibility-toggle" type="button" data-password-toggle
										aria-controls="confirmPassword" aria-label="Hiện mật khẩu" aria-pressed="false">
									<i class="bi bi-eye" aria-hidden="true"></i>
								</button>
							</div>
							<div class="invalid-feedback d-block" th:errors="*{confirmPassword}"></div>
						</div>
						<button class="btn btn-primary w-100" type="submit">Lưu mật khẩu mới</button>
					</form>
					<p class="text-center mt-4 mb-0">
						<a th:href="@{/auth/login}">Quay lại đăng nhập</a>
					</p>
				</div>
			</div>
		</div>
	</div>
</section>
<th:block layout:fragment="scripts">
	<script th:src="@{/js/auth-password-strength.js}" defer></script>
</th:block>
</body>
</html>
