spring.application.name=tcgshop
spring.profiles.active=local

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB

spring.thymeleaf.cache=false

app.jwt.access-expiration-minutes=30
app.jwt.refresh-expiration-days=7
app.jwt.access-cookie-name=ACCESS_TOKEN
app.jwt.refresh-cookie-name=REFRESH_TOKEN
app.cookie.secure=false
app.login.max-failed-attempts=5
app.login.lock-minutes=15
app.address.max-per-user=10
app.order.escalation-window-days=3

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.sender-name=TCG Shop
app.otp.length=6
app.otp.valid-minutes=5
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60

app.reconcile.run-on-startup=false
app.reconcile.max-findings-per-check=50
